name: Android CI / Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 com Cache do Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Conceder permissão ao Gradle Executable
        run: chmod +x gradlew

      - name: Executar Testes Unitários
        run: ./gradlew test

      - name: Compilar APK de Release
        run: ./gradlew assembleRelease

      - name: Disponibilizar APK como Artefato de Download
        uses: actions/upload-artifact@v4
        with:
          name: HourCalculator-APK
          path: app/build/outputs/apk/release/*.apk
