name: Android CI / Build APK e Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17 com Cache do Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Conceder permissão ao Gradle Executable
        run: chmod +x gradlew

      - name: Executar Testes Unitários
        run: ./gradlew test

      - name: Compilar APK de Release
        run: ./gradlew assembleRelease

      - name: Disponibilizar APK como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: HourCalculator-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Criar Release Oficial no GitHub
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
